{{ define "og_preview" }}
    <meta name="description" content="{{ index .labels "auth.tagline" }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cifra" />
    <meta property="og:title" content="Cifra · {{ index .labels "brand.eyebrow" }}" />
    <meta property="og:description" content="{{ index .labels "auth.tagline" }}" />
    <meta property="og:image" content="{{ absURL .site.AppURL "/static/og.png" }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cifra · {{ index .labels "brand.eyebrow" }}" />
    <meta property="og:locale" content="{{ if eq .htmlLang "pt" }}pt_BR{{ else }}en_US{{ end }}" />
    {{ if .site.AppURL }}<meta property="og:url" content="{{ absURL .site.AppURL "/" }}" />{{ end }}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cifra · {{ index .labels "brand.eyebrow" }}" />
    <meta name="twitter:description" content="{{ index .labels "auth.tagline" }}" />
    <meta name="twitter:image" content="{{ absURL .site.AppURL "/static/og.png" }}" />
{{ end }}
