{{ define "content" }}
<form action="/forgot-password" method="post" class="space-y-3" data-amarra-drive="true">
  {{ csrfField .CSRFToken }}
  <input type="email" name="email" placeholder="Email" class="block w-full border border-paper-200/20 bg-ink-800 p-2.5 text-sm text-paper-50" />
  <button type="submit" class="w-full bg-copper-500 px-4 py-2.5 text-sm font-medium text-ink-950">{{ index .labels "auth.forgot_submit" }}</button>
</form>
{{ end }}
