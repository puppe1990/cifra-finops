{{ define "content" }}
<h2 class="font-display text-4xl">{{ index .labels "bud.title" }}</h2>
<ul class="mt-8 space-y-3">
  {{ range .budgets }}
  <li class="border border-paper-200/15 bg-ink-900 p-4">
    <p class="text-sm">{{ .name }}</p>
    <p class="font-mono text-2xl text-copper-400">{{ .spent }} / {{ .amount }}</p>
  </li>
  {{ else }}
  <li class="text-sm text-paper-200">{{ index .labels "bud.empty" }}</li>
  {{ end }}
</ul>
<form action="/budgets" method="post" class="mt-10 max-w-md space-y-3 border border-paper-200/15 bg-ink-900 p-5" data-amarra-drive="true">
  {{ csrfField .CSRFToken }}
  <h3 class="font-display text-2xl">{{ index .labels "bud.new" }}</h3>
  <input name="name" placeholder="{{ index .labels "bud.ph_name" }}" class="w-full border border-paper-200/20 bg-ink-800 p-2.5 text-sm" />
  <input name="amount_usd" placeholder="{{ index .labels "bud.ph_amount" }}" class="w-full border border-paper-200/20 bg-ink-800 p-2.5 text-sm" />
  <button type="submit" class="bg-copper-500 px-4 py-2 text-sm text-ink-950">{{ index .labels "bud.create" }}</button>
</form>
{{ end }}
