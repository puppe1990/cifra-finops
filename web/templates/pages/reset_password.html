{{ define "content" }}
<form action="/reset-password" method="post" class="space-y-3" data-amarra-drive="true">
  {{ csrfField .CSRFToken }}
  <input type="hidden" name="token" value="{{ .Token }}" />
  <div class="relative">
    <input type="password" name="password" autocomplete="new-password" placeholder="{{ index .labels "auth.password_label" }}" class="block w-full border border-paper-200/20 bg-ink-800 p-2.5 text-sm text-paper-50" />
    <.password_toggle />
  </div>
  <div class="relative">
    <input type="password" name="password_confirmation" autocomplete="new-password" placeholder="{{ index .labels "auth.password_confirmation_label" }}" class="block w-full border border-paper-200/20 bg-ink-800 p-2.5 text-sm text-paper-50" />
    <.password_toggle />
  </div>
  <button type="submit" class="w-full bg-copper-500 px-4 py-2.5 text-sm font-medium text-ink-950">{{ index .labels "auth.reset_submit" }}</button>
</form>
{{ end }}
