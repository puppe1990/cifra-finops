{{ define "content" }}
<h2 class="font-display text-4xl">{{ index .labels "set.title" }}</h2>
<p class="mt-3 max-w-2xl text-sm leading-relaxed text-paper-200">{{ index .labels "set.lead" }}</p>
<form action="/sync" method="post" data-amarra-drive="true">
  {{ csrfField .CSRFToken }}
  <button type="submit" class="mt-6 border border-copper-500 px-4 py-2 font-mono text-xs uppercase tracking-widest text-copper-400">{{ index .labels "set.sync" }}</button>
</form>
{{ if .cloudShell }}
<h3 class="mt-10 font-display text-2xl">{{ index .labels "set.cloudshell" }}</h3>
<pre class="mt-3 overflow-x-auto whitespace-pre-wrap break-all border border-ink-700 bg-ink-900 p-4 font-mono text-[11px] text-paper-200" amarra-hook="clipboard" data-amarra-copy="{{ .cloudShell }}">{{ .cloudShell }}</pre>
{{ end }}
<h3 class="mt-10 font-display text-2xl">{{ index .labels "set.policy" }}</h3>
<pre class="mt-3 overflow-x-auto border border-ink-700 bg-ink-900 p-4 font-mono text-[11px] text-paper-200">{{ .policy }}</pre>
{{ end }}
