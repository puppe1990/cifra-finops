{{ define "content" }}
<form action="/login" method="post" class="space-y-3" data-amarra-drive="true">
  {{ csrfField .CSRFToken }}
  <div>
    <input type="email" name="email" placeholder="{{ index .labels "auth.email_label" }}" class="block w-full border border-paper-200/20 bg-ink-800 p-2.5 text-sm text-paper-50 outline-none focus:border-copper-500" />
    {{ if .Errors }}{{ with index .Errors "email" }}<p class="mt-1 text-xs text-copper-400">{{ . }}</p>{{ end }}{{ end }}
  </div>
  <div class="relative">
    <input type="password" name="password" autocomplete="current-password" placeholder="{{ index .labels "auth.password_label" }}" class="block w-full border border-paper-200/20 bg-ink-800 p-2.5 text-sm text-paper-50" />
    <.password_toggle />
  </div>
  <button type="submit" class="w-full bg-copper-500 px-4 py-2.5 text-sm font-medium tracking-wide text-ink-950">{{ index .labels "auth.login_submit" }}</button>
  <p class="pt-1 text-center text-xs text-paper-200">
    <a href="/signup" data-amarra-drive="true" class="text-copper-400 underline">{{ index .labels "auth.signup_prompt" }}</a>
    ·
    <a href="/forgot-password" data-amarra-drive="true" class="text-copper-400 underline">{{ index .labels "auth.forgot_password" }}</a>
  </p>
</form>
{{ end }}
